<script>
const questions = [
{
q:"Maraknya pembentukan komunitas online berbasis kecerdasan buatan (AI) membuat batas antara ruang fisik dan digital semakin kabur. Individu merasa memiliki keterikatan batin yang tinggi di dalam grup maya meski tak pernah bertatap muka langsung. Fenomena ini menunjukkan adanya transformasi bentuk solidaritas sosial menurut Émile Durkheim, yaitu...",

},
{
q:"Maraknya praktik pinjaman online (pinjol) ilegal di kalangan kaum muda usia produktif memicu maraknya depresi dan disfungsi sosial dalam keluarga. Analisis sosiologis yang tepat menggunakan teori anomi dari Robert K. Merton adalah...",

"D. Hilangnya kesadaran kolektif akibat pengaruh modernisasi Barat",
"E. Respon adaptasi individu dalam bentuk konformitas ekstrem terhadap standar hidup"
],a:"B",r:"Teori anomi Merton menjelaskan ketegangan ketika tujuan budaya, seperti kesuksesan finansial, tidak diimbangi akses yang sama terhadap cara-cara yang sah."
},
{
q:"Fenomena \"Gig Economy\" yang melahirkan banyaknya pekerja lepas (freelancer) dan pengemudi transportasi daring menciptakan bentuk hubungan kerja baru. Ditinjau dari pandangan Karl Marx, fenomena ini dapat memicu...",
o:[

"E. Transisi mulus menuju masyarakat tanpa kelas berbasis teknologi"
],a:"B",r:"Dalam perspektif Marx, alienasi dapat muncul ketika pekerja memiliki kontrol terbatas terhadap pekerjaan dan hasil kerjanya. Ketidakpastian kerja dapat memperkuat kondisi tersebut."
},
{
q:"Maraknya tren \"Flexing\" gaya hidup mewah di media sosial oleh para figur publik menimbulkan perubahan standar konsumsi masyarakat bawah. Fenomena ini paling tepat dijelaskan dengan konsep...",
o:[
"A. Conspicuous Consumption (Thorstein Veblen)",

"C. Cultural Lag (William F. Ogburn)",
"D. Looking-Glass Self (Charles H. Cooley)",
"E. Social Mobility (Pitirim Sorokin)"

{

o:[
"A. Konflik rasial antara pendatang dan suku asli",

},
{
q:"Dalam lanskap media digital, fenomena \"Echo Chamber\" dan \"Filter Bubble\" membuat netizen hanya menerima informasi yang sesuai dengan pandangan mereka sendiri, sehingga meningkatkan polarisasi politik. Proses interaksi sosial yang terhambat di sini adalah...",
o:[
"A. Akomodasi formal",
"B. Asimilasi struktural",
"C. Oposisi konstruktif",
"D. Kontak sosial sekunder yang komunikatif dan objektif",
"E. Amalgamasi budaya digital"
],a:"D",r:"Echo chamber dan filter bubble dapat membatasi pertukaran informasi lintas pandangan. Dalam soal ini, proses kontak sosial sekunder yang terbuka dan komunikatif menjadi terhambat."
},
{
q:"Fenomena perundungan siber (cyberbullying) yang melibatkan remaja sekolah menengah sering kali bersumber dari pembentukan kelompok in-group dan out-group yang tajam di media sosial. Hal ini menunjukkan bahwa fungsi kelompok sosial telah mengalami penyelewengan, yaitu...",
o:[
"A. Penurunan derajat solidaritas internal kelompok",
"B. Penguatan identitas kelompok yang disertai prasangka dan stereotip negatif terhadap pihak luar",
"C. Kegagalan fungsi pengawasan dari lembaga media cetak",
"D. Peningkatan daya saing akademis antaranggota kelompok",
"E. Perubahan struktur kelompok dari sekunder menjadi primer"
],a:"B",r:"Identitas kelompok yang kuat dapat berubah menjadi in-group bias ketika anggota memberi penilaian negatif atau prasangka kepada out-group."
},
{
q:"Gelombang otomatisasi dan penerapan sistem AI di berbagai industri di Indonesia memicu ancaman pemutusan hubungan kerja (PHK) masif pada pekerjaan rutin. Penjelasan sosiologis mengenai kesiapan masyarakat terhadap perubahan ini mengarah pada...",
o:[
"A. Cultural Shock akibat perubahan nilai-nilai keagamaan",
"B. Cultural Lag karena kecepatan teknologi tak diimbangi kesiapan institusi pendidikan dan keahlian tenaga kerja",

},
{
q:"Fenomena kemunculan \"Childfree\" (keputusan untuk tidak memiliki anak) di kalangan pasangan muda perkotaan mulai menggeser fungsi tradisional lembaga keluarga. Fungsi lembaga keluarga yang paling langsung terpengaruh oleh tren ini adalah...",
o:[
"A. Fungsi Afeksi dan Sosialisasi",
"B. Fungsi Proteksi dan Protektif",
"C. Fungsi Reproduksi dan Biologis",
"D. Fungsi Ekonomi dan Pengawasan",

},
{
q:"Tren penggunaan aplikasi kencan daring (dating apps) telah mengubah pola pencarian pasangan di kalangan milenial. Jika dianalisis dengan teori Dramaturgi Erving Goffman, profil akun pengguna aplikasi kencan berfungsi sebagai...",
o:[
"A. Backstage tempat individu menampilkan karakter aslinya tanpa rekayasa",
"B. Frontstage tempat individu mengelola kesan (impression management) demi penilaian positif",
"C. Setting fisik yang menentukan norma sosial secara langsung",
"D. Off-stage yang tidak memengaruhi proses interaksi sosial",
"E. Script formal yang diatur oleh institusi agama"
],a:"B",r:"Frontstage adalah bagian ketika individu menampilkan diri di hadapan audiens dan melakukan impression management."
},
{
q:"Gelombang protes mahasiswa dan masyarakat sipil terhadap revisi undang-undang yang dinilai merugikan demokrasi menunjukkan bentuk gerakan sosial...",
o:[
"A. Gerakan konservatif yang mempertahankan status quo",
"B. Gerakan reformis yang menuntut perbaikan sistem hukum dan tata kelola pemerintahan",
"C. Gerakan radikal yang ingin mengganti ideologi negara",
"D. Gerakan ekspresif yang berfokus pada emosi personal",
"E. Gerakan regresif yang ingin kembali ke masa lalu"
],a:"B",r:"Gerakan reformis bertujuan mengubah atau memperbaiki bagian tertentu dari sistem yang sudah ada, bukan mengganti seluruh sistem."
},
{
q:"Praktik nepotisme dan politik dinasti dalam ranah pemerintahan daerah memperlihatkan bahwa saluran mobilitas sosial telah terhambat oleh...",
o:[
"A. Ascribed status yang mendominasi atas achieved status",
"B. Tingginya meritokrasi dalam sistem birokrasi",
"C. Keterbukaan struktur sosial terhadap kelas bawah",
"D. Mobilisasi vertikal naik yang berbasis kualifikasi akademis",
"E. Dominasi mobilitas antargenerasi secara terbuka"
],a:"A",r:"Ascribed status diperoleh karena kelahiran atau latar belakang. Jika hubungan keluarga lebih menentukan daripada prestasi, kesempatan mobilitas berbasis achieved status dapat terhambat."
},
{
q:"Fenomena \"Cancel Culture\" di media sosial yang menghukum sanksi sosial berupa pengucilan online terhadap figur publik pelaku pelanggaran etika merupakan bentuk kontrol sosial...",
o:[
"A. Formal dan Represif",
"B. Informal dan Komunal-Digital",
"C. Coercive dan Koersif Birokratis",
"D. Institusional dan Hukum Tertulis",
"E. Persuasif dan Edukatif Sekolahan"
],a:"B",r:"Pengucilan oleh komunitas online bukan sanksi hukum formal, sehingga termasuk kontrol sosial informal yang berlangsung melalui komunitas digital."
},
{
q:"Pembentukan komunitas partisipatif pengolahan sampah mandiri di tingkat RW berbasis aplikasi pengelolaan limbah digital menunjukkan contoh...",
o:[
"A. Konflik lingkungan antarwarga",
"B. Pembangunan berpusat pada negara (state-centered development)",

},
{
q:"Meningkatnya angka kejahatan peretasan data pribadi (phishing dan data breach) di Indonesia dikategorikan sebagai penyimpangan sosial modern karena...",
o:[
"A. Dilakukan tanpa melanggar hukum normatif negara",
"B. Merupakan bentuk white-collar crime atau cybercrime yang merugikan hak privasi masyarakat",
"C. Hanya berdampak pada individu tingkat ekonomi atas",
"D. Bersumber dari ketidakmampuan beradaptasi dengan norma lokal",
"E. Termasuk dalam penyimpangan primer yang dapat ditoleransi"
],a:"B",r:"Phishing dan data breach merupakan bentuk kejahatan yang memanfaatkan teknologi dan dapat merugikan privasi serta keamanan data."
},
{
q:"Tingginya angka partisipasi kerja wanita di sektor formal perkotaan memicu pergeseran peran dalam keluarga, di mana suami turut membagi peran domestik. Realitas ini mencerminkan fenomena...",
o:[
"A. Reorganisasi fungsi keluarga berbasis kesetaraan gender",
"B. Disintegrasi struktur keluarga patriarki total",

"D. Konflik peran yang tak terelakkan di antara pasangan suami istri",
"E. Hilangnya fungsi sosialisasi anak secara menyeluruh"
],a:"A",r:"Pembagian peran domestik yang lebih seimbang menunjukkan reorganisasi fungsi keluarga menuju pembagian peran yang lebih setara."
},
{
q:"Kebijakan digitalisasi transaksi keuangan (QRIS) membuat pedagang pasar tradisional harus beradaptasi dengan teknologi pembayaran nirsentuh. Kesiapan ini menunjukkan proses...",

{

},
{
q:"Keberadaan warung kopi modern (coffee shop) yang berfungsi sebagai ruang kerja bersama (co-working space) bagi generasi muda mencerminkan perubahan fungsi ruang publik, yaitu dari...",

let current = 0;
let score = 0;
let answers = Array(questions.length).fill(null);

const combo = {
  A:["1","2","3"],
  B:["1","2","4"],
  C:["1","3"],
  D:["2","4"],
  E:["1","2","3","4"]
};

function render(){
  const q = questions[current];
  document.getElementById("number").textContent = `Soal ${current+1} dari ${questions.length}`;
  document.getElementById("part").textContent =
    current < 20 ? "Bagian I: Pilihan Ganda Tunggal" : "Bagian II: Pilihan Ganda Kompleks";
  document.getElementById("section").textContent =
    current < 20 ? "Pilihan Ganda Tunggal" : "Pilihan Ganda Kompleks";
  document.getElementById("question").textContent = q.q;

  const box = document.getElementById("options");
  box.innerHTML = "";

  q.o.forEach((text,i)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.innerHTML = q.complex
      ? `<span class="letter">${i+1}</span>${text}`
      : `<span class="letter">${String.fromCharCode(65+i)}</span>${text.substring(3)}`;
    btn.onclick=()=>choose(i);
    if(answers[current] !== null){
      btn.classList.add("disabled");
      if(!q.complex && String.fromCharCode(65+i)===q.a) btn.classList.add("correct");
      if(!q.complex && answers[current]===i && String.fromCharCode(65+i)!==q.a) btn.classList.add("wrong");
    }
    box.appendChild(btn);
  });

  if(q.complex){
    // Complex questions use the A-E combination answers.
    box.innerHTML = "";
    const labels = [
      ["A","(1), (2), dan (3) benar"],
      ["B","(1), (2), dan (4) benar"],
      ["C","(1) dan (3) benar"],
      ["D","(2) dan (4) benar"],
      ["E","Semua pernyataan benar"]
    ];
    labels.forEach(([letter,text],i)=>{
      const btn=document.createElement("button");
      btn.className="option";
      btn.innerHTML=`<span class="letter">${letter}</span>${text}`;
      btn.onclick=()=>choose(i);
      if(answers[current] !== null){
        btn.classList.add("disabled");
        if(letter===q.a) btn.classList.add("correct");
        if(answers[current]===i && letter!==q.a) btn.classList.add("wrong");
      }
      box.appendChild(btn);
    });
  }

  const reason=document.getElementById("reason");
  if(answers[current] !== null){
    reason.style.display="block";
    reason.innerHTML=`<b>Jawaban:</b> ${q.a}<br><br><b>Alasan:</b> ${q.r}`;
  }else{
    reason.style.display="none";
  }

  document.getElementById("prev").disabled=current===0;
  document.getElementById("next").textContent=current===questions.length-1?"Selesai":"Selanjutnya";
  document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
}

function choose(index){
  if(answers[current]!==null) return;
  answers[current]=index;
  const correctIndex="ABCDE".indexOf(questions[current].a);
  if(index===correctIndex) score++;
  render();
}

function nextQuestion(){
  if(answers[current]===null){
    alert("Pilih jawaban terlebih dahulu.");
    return;
  }
  if(current<questions.length-1){
    current++;
    render();
  }else{
    showResult();
  }
}

function previousQuestion(){
  if(current>0){
    current--;
    render();
  }
}

function showResult(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  const nilai=Math.round(score/questions.length*100);
  document.getElementById("score").textContent=`${score} / ${questions.length}`;
  document.getElementById("resultText").innerHTML=
    `Nilai kamu: <b>${nilai}</b><br>
     Jawaban benar: ${score}<br>
     Jawaban salah: ${questions.length-score}`;
}

function restartQuiz(){
  current=0;
  score=0;
  answers=Array(questions.length).fill(null);
  document.getElementById("quiz").style.display="block";
  document.getElementById("result").style.display="none";
  render();
}

render();
</script>
